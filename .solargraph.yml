---
include:
  # process first
  - "Gemfile"
  - "*.gemspec"
  - "Rakefile"
  - "config/annotations*.rb"
  - "**/*.rb"
  - "**/.*.rb"
  - "lib/tasks/*.rake"
  - ".git-hooks/**/*.rb"
  - "script/*"
  - "bin/*"
  - "bin/overcommit_branch"
exclude:
  # Cursor skills/scripts are agent tooling, not gem API surface
  - '.cursor/**/*'
  # vendored
  - 'bin/bundle'
  - 'bin/brakeman'
  - 'bin/bump'
  - 'bin/tapioca' # regenerated by bin/tapioca init during build-typecheck
  - 'rakelib/*.rake'
  - 'feature/feature_helper.rb'
  - script/.rubocop.yml
  - vendor/**/*
  - ".bundle/**/*"
  - ".markdownlint_style.rb"
  # Mocha-heavy test helper stays excluded from strong typecheck.
  - test/unit/test_helper.rb
require:
  # Must be the RBS stdlib library name (hyphenated), not the Ruby require path
  # ('net/http'). Solargraph doesn't translate require paths to RBS library names, so
  # without this the real net-http RBS core sig never loads and Net::HTTP falls back to
  # whichever gem happens to reopen the class (multipart-post here), hiding Net::HTTP::Get
  # and #request. https://github.com/castwide/solargraph/issues/1256
  - net-http
domains: []
reporters:
  - rubocop
  - require_not_found
  - typecheck:strong
  - update_errors
formatter:
  rubocop:
    cops: safe
    except: []
    only: []
    extra_args: []
require_paths: []
plugins: []
max_files: 5000
