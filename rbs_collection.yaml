# Download sources
sources:
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    # A commit rather than a branch, so CI's `rbs collection update` doesn't
    # rewrite rbs_collection.lock.yaml each time upstream adds a commit.
    # Change it to pick up newer gem type signatures.
    revision: 37e2e1c287da3f4e14a231bd904d639681464ec9
    repo_dir: gems

# You can specify local directories as sources also.
# - type: local
#   path: path/to/your/local/repository

# A directory to install the downloaded RBSs
path: .gem_rbs_collection

# gems:
#   # If you want to avoid installing rbs files for gems, you can specify them here.
#   - name: GEM_NAME
#     ignore: true
