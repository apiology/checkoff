# Download sources
sources:
  # asana 0.10 RBS pending upstream in ruby/gem_rbs_collection
  - type: git
    name: apiology/gem_rbs_collection
    remote: https://github.com/apiology/gem_rbs_collection.git
    revision: add-asana-signatures
    repo_dir: gems
  # gli RBS pending upstream in ruby/gem_rbs_collection
  - type: git
    name: apiology/gem_rbs_collection#add-gli-signatures
    remote: https://github.com/apiology/gem_rbs_collection.git
    revision: add-gli-signatures
    repo_dir: gems
  # cache_method RBS pending upstream in ruby/gem_rbs_collection
  - type: git
    name: apiology/gem_rbs_collection#add-cache-method-signatures
    remote: https://github.com/apiology/gem_rbs_collection.git
    revision: add-cache-method-signatures
    repo_dir: gems
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: main
    repo_dir: gems

# You can specify local directories as sources also.
# - type: local
#   path: path/to/your/local/repository

# A directory to install the downloaded RBSs
path: .gem_rbs_collection

